name: E2E Tests

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Run with debug mode enabled'
        required: false
        default: 'false'

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  e2e-tests:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Start Docker Compose services
        working-directory: ./docker
        run: |
          docker-compose up -d --build
          echo "Waiting for services to be healthy..."

      - name: Wait for services to be ready
        run: |
          echo "Waiting for backend..."
          timeout 120 bash -c 'until curl -s http://localhost:8080/health > /dev/null 2>&1; do sleep 2; done'
          echo "Backend is ready!"

          echo "Waiting for frontend..."
          timeout 120 bash -c 'until curl -s http://localhost:3000/health > /dev/null 2>&1; do sleep 2; done'
          echo "Frontend is ready!"

          echo "All services are healthy!"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'e2e-tests/package-lock.json'

      - name: Install dependencies
        working-directory: ./e2e-tests
        run: npm ci || npm install

      - name: Install Playwright browsers
        working-directory: ./e2e-tests
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests
        working-directory: ./e2e-tests
        run: npx playwright test
        env:
          FRONTEND_URL: http://localhost:3000
          BACKEND_URL: http://localhost:8080
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e-tests/playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: e2e-tests/test-results/
          retention-days: 7

      - name: Collect Docker logs on failure
        if: failure()
        working-directory: ./docker
        run: |
          echo "=== Backend logs ==="
          docker-compose logs backend
          echo "=== Frontend logs ==="
          docker-compose logs frontend
          echo "=== Postgres logs ==="
          docker-compose logs postgres

      - name: Stop Docker Compose services
        if: always()
        working-directory: ./docker
        run: docker-compose down -v

  # Optional: Run tests on multiple browsers
  e2e-tests-cross-browser:
    name: Cross-browser Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch'
    needs: e2e-tests

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start Docker Compose services
        working-directory: ./docker
        run: |
          docker-compose up -d --build
          echo "Waiting for services to be healthy..."

      - name: Wait for services to be ready
        run: |
          timeout 120 bash -c 'until curl -s http://localhost:8080/health > /dev/null 2>&1; do sleep 2; done'
          timeout 120 bash -c 'until curl -s http://localhost:3000/health > /dev/null 2>&1; do sleep 2; done'
          echo "All services are healthy!"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./e2e-tests
        run: npm ci || npm install

      - name: Install Playwright browsers
        working-directory: ./e2e-tests
        run: npx playwright install ${{ matrix.browser }} --with-deps

      - name: Run Playwright tests
        working-directory: ./e2e-tests
        run: npx playwright test --project=${{ matrix.browser }}
        env:
          FRONTEND_URL: http://localhost:3000
          BACKEND_URL: http://localhost:8080
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: e2e-tests/playwright-report/
          retention-days: 30

      - name: Stop Docker Compose services
        if: always()
        working-directory: ./docker
        run: docker-compose down -v
